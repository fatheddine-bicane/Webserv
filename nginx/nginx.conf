# INFO: only action directives can be inherited
# The inheritance flows strictly downward: http block ➔ server block ➔ location block
# the inherited directives are: root, error_page, client_max_body_size, client_body_temp_path, autoindex, index, dav_methods, create_full_put_path


events{}

http {
	server {
		# =========================================================
		# 1. GLOBAL SERVER SETTINGS
		# =========================================================

		server_name test;
		# Listen on a specific IP and port (Loopback NIC in this case)
		listen 127.0.0.1:8080;

		# Set default error page. 
		# WARNING: Can be overridden in location directives.
		error_page 404 /404.html;

		# Set default root directory for the entire server. 
		# WARNING: Can be overridden in location directives.
		root /www/html;

		# Set the maximum allowed size for client body.
		# NOTE: Nginx default is '1m'.
		client_max_body_size 50m;

		# =========================================================
		# 2. ACCESS CONTROL & DIRECTORY LISTING
		# =========================================================
		location /some-folder/ {
			# Specify accepted HTTP methods. Accepts GET and POST, denies the rest.
			limit_except GET POST {
				deny all;
			}

			# Directory location mapping using 'root'
			# Appends the matched URI to the root path.
			# WARNING: String concatenation without checking boundaries.
			root /www/html;

			# Enable directory listing.
			# If the request is a folder, generates an HTML list of files.
			autoindex on;

			# Default file for a directory.
			# NOTE: If this file exists, it overrides autoindex and serves the file instead.
			index index.html default.html;
		}

		# =========================================================
		# 3. PATH REPLACEMENT (Alias Demonstration)
		# =========================================================
		location /assets/ {
			# Replaces the matched location prefix with the specified path.
			# Request for /assets/image.png becomes /var/www/static/image.png
			alias /var/www/static/;
		}

		# =========================================================
		# 4. HTTP REDIRECTION (Standalone)
		# =========================================================
		location /old-page {
			# Instantly returns a 301 status code and sets the Location header.
			return 301 /new-page;
		}

		# =========================================================
		# 5. FILE UPLOADS & DELETION (WebDAV)
		# =========================================================
		location /media/ {
			# Restrict methods to only allow DELETE
			limit_except DELETE {
				deny all;
			}

			# Authorize Nginx to use OS functions to write/delete files.
			dav_methods DELETE;

			# Storage destination for uploaded media.
			root /var/www/storage/;

			# Override global max body size specifically for media uploads.
			# client_max_body_size 10m;

			# Define temporary storage while the file is chunked/uploaded.
			client_body_temp_path /tmp/nginx_uploads_temp;

			# Allow Nginx to execute mkdir -p if parent folders do not exist.
		}

		# =========================================================
		# 6. CGI EXECUTION MAPPING
		# =========================================================

		# location /cgi-bin {
		# 	root /var/www/cgi-bin;
		#
		# 	cgi_pass .py /usr/bin/python3;
		# 	cgi_pass .js /usr/bin/nodejs;
		# }
	}


	server {
		# =========================================================
		# 1. GLOBAL SERVER SETTINGS
		# =========================================================

		server_name test;
		# Listen on a specific IP and port (Loopback NIC in this case)
		listen 127.0.0.1:3000;

		location / {
			autoindex on;
			index index.py;
			cgi_pass .py /usr/bin/python3;
			error_page 404 ./nginx/www/404.html;

			root ./nginx/www;

			limit_except GET {
				deny all;
			}


		}

	}

}
